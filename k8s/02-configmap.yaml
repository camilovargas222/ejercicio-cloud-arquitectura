apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-service-config
  namespace: cloud-native-lab
data:
  PORT: "3000"
  NODE_ENV: "production"
  SERVICE_NAME: "catalog-microservice"
  SERVICE_VERSION: "1.0.0"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  CB_FAILURE_THRESHOLD: "3"
  CB_RESET_TIMEOUT_MS: "10000"
