apiVersion: v1
kind: Service
metadata:
  name: catalog-microservice-service
  namespace: cloud-native-lab
  labels:
    app: catalog-microservice
spec:
  type: NodePort
  selector:
    app: catalog-microservice
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30080
