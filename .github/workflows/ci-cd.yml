name: CI/CD Pipeline - Microservicio Cloud-Native & Kubernetes

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  IMAGE_NAME: catalog-microservice
  IMAGE_TAG: 1.0.0
  K8S_NAMESPACE: cloud-native-lab

jobs:
  build-and-unit-tests:
    name: 1. Compilar y Ejecutar Pruebas Unitarias (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo fuente
        uses: actions/checkout@v4

      - name: Configurar entorno Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Verificar tipado estatico y compilar microservicio TypeScript
        run: |
          npm run lint:types
          npm run build

      - name: Ejecutar pruebas unitarias y de resiliencia con cobertura (Jest)
        run: npm run test:coverage

      - name: Subir artefacto compilado (dist/)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-microservice
          path: dist/

  docker-build:
    name: 2. Contenerizar Microservicio con Docker
    runs-on: ubuntu-latest
    needs: build-and-unit-tests

    steps:
      - name: Checkout del codigo fuente
        uses: actions/checkout@v4

      - name: Construir imagen Docker Multi-Stage
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Prueba de humo del contenedor Docker (Smoke Test)
        run: |
          docker run -d --name test-container -p 3000:3000 ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          sleep 5
          curl --fail http://localhost:3000/api/v1/health
          docker stop test-container

  deploy-to-kubernetes:
    name: 3. Desplegar Automaticamente en Cluster Kubernetes (Minikube / Cloud)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Iniciar cluster Kubernetes (Minikube) en el Runner de CI/CD
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker
          kubernetes-version: v1.30.0

      - name: Construir y cargar imagen en el cluster Kubernetes
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
          minikube image load ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Desplegar manifiestos de Kubernetes
        run: |
          kubectl apply -f k8s/01-namespace.yaml
          kubectl apply -f k8s/02-configmap.yaml
          kubectl apply -f k8s/03-secret.yaml
          kubectl apply -f k8s/04-deployment.yaml
          kubectl apply -f k8s/05-service.yaml
          kubectl apply -f k8s/06-hpa.yaml

      - name: Verificar despliegue exitoso
        run: |
          kubectl rollout status deployment/catalog-microservice-deployment -n ${{ env.K8S_NAMESPACE }} --timeout=120s
          kubectl get pods,svc,hpa -n ${{ env.K8S_NAMESPACE }}
